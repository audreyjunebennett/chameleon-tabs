<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chamie Config</title>
  <link rel="stylesheet" href="picker.css">
  <script src="picker.js" defer></script>
</head>
<body>
  <header>
    <img class="mascot" src="icons/chameleon-128.png" width="42" height="42" alt="">
    <div>
      <h1>Chamie Config</h1>
      <p>Bring your desktop apps into Chrome tabs.</p>
    </div>
    <button id="settings" type="button" aria-label="Settings" title="Settings">⚙</button>
  </header>
  <main aria-labelledby="windows-heading">
    <h2 id="windows-heading">Attach an open window</h2>
    <div id="windows"></div>
    <p id="status" role="status">Looking for windows…</p>
    <p id="setup" hidden><a href="https://github.com/audreyjunebennett/chameleon-tabs/releases" target="_blank" rel="noopener noreferrer">Get the Windows helper</a></p>
  </main>
  <footer>
    <button type="button" id="detach">Return all apps to desktop</button>
  </footer>
</body>
</html>
